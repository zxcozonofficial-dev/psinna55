<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>psinna55</title>
<meta name="description" content="psinna55, minecraft pvp. tiers cis / atiers.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23f0f0f0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Fira+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#000;
  --fg:#f0f0f0;
  --dim:#5c5c5c;
  --line:#1f1f1f;
  --f-black:"UnifrakturMaguntia", "Old English Text MT", serif;
  --f-mono:"Fira Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
body{color:var(--fg);font-family:var(--f-mono);font-size:15px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}

.grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.09;mix-blend-mode:screen}

.wrap{
  max-width:1040px;margin:0 auto;position:relative;z-index:1;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 40px;
}

.top{display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--dim);font-size:13px}

.snd{display:inline-flex;align-items:center;gap:10px;background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;padding:4px 0}
.snd:hover{color:var(--fg)}
.snd .eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.snd .eq i{display:block;width:2px;height:2px;background:var(--fg)}
.snd.off .eq i{background:var(--dim)}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.flash{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 70% 45% at 50% 22%, rgba(255,255,255,.16), transparent 70%)}
.wrap.shake{animation:shake .14s steps(3)}
@keyframes shake{33%{transform:translate(2px,-1px)}66%{transform:translate(-2px,1px)}}

.enter{
  position:fixed;inset:0;z-index:10;background:var(--bg);color:var(--fg);border:0;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;
  font:inherit;transition:opacity .6s ease, visibility .6s;
  padding:env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
.enter .e1{font-family:var(--f-mono);font-size:14px;letter-spacing:.2em;animation:pulse 1.6s steps(2) infinite}
.enter .e2{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.enter .e0{font-family:var(--f-black);font-size:clamp(56px,14vw,120px);line-height:1}
.enter.gone{opacity:0;visibility:hidden;pointer-events:none}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.enter .e1{animation:none}}

#name{display:block;width:100%;height:clamp(150px, 30vw, 320px);margin-top:24px;cursor:crosshair;touch-action:pan-y}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.sub{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-top:6px}
.sub b{color:var(--fg);font-weight:500}

.body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;margin-top:72px;border-top:1px solid var(--line);padding-top:28px}
.col{min-width:0}
.col h2{font-family:var(--f-black);font-weight:400;font-size:34px;line-height:1;margin:0 0 18px}
.col h2 small{font-family:var(--f-mono);font-size:12px;color:var(--dim);margin-left:8px;vertical-align:middle}

.tiers{list-style:none;margin:0;padding:0}
.tiers li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:3px 6px;margin:0 -6px;cursor:default;transition:background .08s,color .08s}
.tiers li .t{color:var(--dim)}
.tiers li.ht .t{color:var(--fg)}
.tiers li.lit{background:var(--fg);color:var(--bg)}
.tiers li.lit .t{color:var(--bg)}

.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:3px 6px;margin:0 -6px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.lnk .t{color:var(--dim)}
.lnk .a{color:var(--dim)}
.lnk:hover{background:var(--fg);color:var(--bg)}
.lnk:hover .t,.lnk:hover .a{color:var(--bg)}

.quote{margin-top:34px;font-family:var(--f-black);font-size:28px;line-height:1.15;color:var(--fg)}

footer{margin-top:96px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;color:var(--dim);font-size:12px}
.by{display:inline-flex;align-items:baseline;gap:8px;color:var(--dim)}
.by-x{display:inline-block;color:var(--fg);font-size:16px;line-height:1;transition:transform .45s cubic-bezier(.7,-0.4,.3,1.4)}
.by-n{font-family:var(--f-black);font-size:26px;line-height:1;color:var(--fg);min-width:4.2em;text-align:left}
.by:hover .by-x,.by:focus-visible .by-x{transform:rotate(180deg)}
.by:hover .by-s,.by:focus-visible .by-s{color:var(--fg)}

@media (max-width:760px){
  .body{grid-template-columns:1fr 1fr;gap:32px 24px;margin-top:44px}
  .body .col:last-child{grid-column:1 / -1}
  #name{height:clamp(130px, 40vw, 220px);margin-top:12px}
  .tiers li{padding:6px;font-size:15px}
  .lnk{padding:12px 6px;font-size:16px;border-bottom:1px solid var(--line)}
  .links{gap:0}
  .quote{margin-top:28px}
  footer{margin-top:64px}
}
@media (hover:none){
  .lnk:hover{background:none;color:inherit}
  .lnk:hover .t,.lnk:hover .a{color:var(--dim)}
  .lnk:active{background:var(--fg);color:var(--bg)}
}
</style>
</head>
<body>

<canvas class="bg" id="bg" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>
<canvas class="grain" id="grain" aria-hidden="true"></canvas>

<button class="enter" id="enter" type="button">
  <span class="e0">psinna55</span>
  <span class="e1">[ click to enter ]</span>
</button>

<audio id="track" src="track.mp3" preload="auto"></audio>

<div class="wrap">
  <div class="top">
    <span>minecraft pvp &middot; <span id="clock">msk</span></span>
    <button class="snd" id="snd" type="button" aria-label="Звук"><span class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></span><span class="tt" id="snd-t">sound</span></button>
  </div>

  <h1>psinna55</h1>
  <canvas id="name" aria-hidden="true"></canvas>
  <div class="sub"><span><b>40</b> pts cis</span><span>i dont play on tier</span></div>

  <div class="body">
    <div class="col">
      <h2>cis <small>8</small></h2>
      <ul class="tiers" id="cis"></ul>
    </div>
    <div class="col">
      <h2>atiers <small>11</small></h2>
      <ul class="tiers" id="at"></ul>
    </div>
    <div class="col">
      <h2>links</h2>
      <div class="links">
        <a class="lnk" href="https://t.me/psinna55" target="_blank" rel="noopener"><span class="t">tg</span><span>@psinna55</span><span class="a">&#8599;</span></a>
        <button class="lnk" id="ds" type="button"><span class="t">ds</span><span id="ds-name">psinna55</span><span class="a" id="ds-a">copy</span></button>
      </div>
      <div class="quote">i love pipa &#9829;</div>
    </div>
  </div>

  <footer><span>psinna55 &copy; 2026</span><a class="by" id="by" href="https://t.me/holyfear" target="_blank" rel="noopener"><span class="by-s">site by</span><span class="by-x">&#10013;</span><span class="by-n" id="by-n">holyfear</span></a></footer>
</div>

<script>
const CIS = [["ht5","cpvp"],["lt3","sword"],["lt3","op"],["lt3","pot"],["lt3","uhc"],["lt3","axe"],["ht4","smp"],["ht4","mace"]];
const AT  = [["lt3","op"],["lt3","smp"],["lt3","dsmp"],["lt3","mace"],["lt4","cpvp"],["lt3","axe"],["lt3","uhc"],["lt4","creeper"],["lt3","sword"],["lt3","npot"],["lt3","suhc"]];
const key = m => m === "npot" ? "pot" : m;
const fill = (id, list) => {
  document.getElementById(id).innerHTML = list.map(([t,m]) =>
    `<li tabindex="0" data-k="${key(m)}" class="${t[0]==="h"?"ht":""}"><span class="t">${t}</span><span>${m}</span></li>`).join("");
};
fill("cis", CIS); fill("at", AT);
const rows = document.querySelectorAll(".tiers li");
const lit = k => rows.forEach(r => r.classList.toggle("lit", r.dataset.k === k));
let pinned = null;
rows.forEach(r => {
  r.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") lit(r.dataset.k); });
  r.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") lit(null); });
  r.addEventListener("pointerup", e => {
    if (e.pointerType === "mouse") return;
    pinned = pinned === r.dataset.k ? null : r.dataset.k;
    lit(pinned);
  });
  r.addEventListener("focus", () => lit(r.dataset.k));
  r.addEventListener("blur", () => lit(null));
});

document.getElementById("ds").addEventListener("click", () => {
  const a = document.getElementById("ds-a");
  const done = t => { a.textContent = t; setTimeout(() => a.textContent = "copy", 1400); };
  const fallback = () => {
    const s = getSelection(), r = document.createRange();
    r.selectNodeContents(document.getElementById("ds-name")); s.removeAllRanges(); s.addRange(r);
    done("ctrl+c");
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText("psinna55").then(() => done("copied"), fallback);
  else fallback();
});

(() => {
  const by = document.getElementById("by"), n = document.getElementById("by-n");
  const word = "holyfear", abc = "abcdefghijklmnopqrstuvwxyz";
  let timer = null;
  const run = () => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    clearInterval(timer);
    let f = 0;
    timer = setInterval(() => {
      n.textContent = word.split("").map((c, i) => i < f / 2 ? c : abc[Math.random() * 26 | 0]).join("");
      if (++f > word.length * 2) { clearInterval(timer); n.textContent = word; }
    }, 40);
  };
  by.addEventListener("pointerenter", run);
  by.addEventListener("focus", run);
})();

const AUDIO = { bass:0, level:0, hit:0, kick:false, bins:null };

(() => {
  const enter = document.getElementById("enter"), audio = document.getElementById("track");
  const snd = document.getElementById("snd"), sndT = document.getElementById("snd-t"), eq = [...document.querySelectorAll("#eq i")];
  const grain = document.getElementById("grain"), flash = document.getElementById("flash"), wrap = document.querySelector(".wrap");
  const bg = document.getElementById("bg"), bctx = bg.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DROP = 15;
  let an = null, avg = 0, flashV = 0, lastKick = 0, dust = [];

  const setup = () => {
    if (an) return;
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaElementSource(audio);
      an = ac.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = .5;
      src.connect(an); an.connect(ac.destination);
      AUDIO.bins = new Uint8Array(an.frequencyBinCount);
      if (ac.state === "suspended") ac.resume();
    } catch(e){ an = null; }
  };

  const seed = () => {
    const w = innerWidth, h = innerHeight, n = Math.round(w * h / 9000);
    dust = Array.from({length:n}, () => ({ x:Math.random()*w, y:Math.random()*h, z:.3 + Math.random()*.7, a:Math.random()*Math.PI*2 }));
  };
  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    bg.width = innerWidth * dpr; bg.height = innerHeight * dpr;
    bctx.setTransform(dpr,0,0,dpr,0,0);
    seed();
  };
  size(); addEventListener("resize", size);

  const loop = (now) => {
    const b = AUDIO.bins;
    AUDIO.kick = false;
    if (an && b && !audio.paused){
      an.getByteFrequencyData(b);
      let s = 0; for (let i = 0; i < 4; i++) s += b[i]; AUDIO.bass = s / 4 / 255;
      let t = 0; for (let i = 0; i < b.length; i++) t += b[i]; AUDIO.level = t / b.length / 255;
      AUDIO.hit = Math.max(0, AUDIO.bass - avg);
      if (AUDIO.bass > .5 && AUDIO.hit > .045 && now - lastKick > 200){ AUDIO.kick = true; lastKick = now; }
      avg = avg * .93 + AUDIO.bass * .07;
    } else { AUDIO.bass *= .9; AUDIO.level *= .9; AUDIO.hit = 0; }

    if (AUDIO.kick){
      flashV = 1;
      if (!reduce){ wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake"); }
    }
    flashV *= .88;
    flash.style.opacity = (flashV * .9 + AUDIO.level * .35).toFixed(3);
    grain.style.opacity = (.07 + AUDIO.level * .2 + flashV * .12).toFixed(3);

    const w = innerWidth, h = innerHeight, sp = reduce ? 0 : .15 + AUDIO.level * 2.2 + flashV * 3;
    bctx.clearRect(0,0,w,h);
    for (const d of dust){
      d.a += .002; d.y -= sp * d.z; d.x += Math.sin(d.a) * .2 * d.z;
      if (d.y < -4){ d.y = h + 4; d.x = Math.random() * w; }
      const al = .12 + d.z * .25 + AUDIO.level * .5 * d.z + flashV * .3;
      bctx.fillStyle = `rgba(240,240,240,${Math.min(1, al).toFixed(3)})`;
      const s = d.z * (1.2 + flashV * 1.5);
      bctx.fillRect(d.x, d.y, s, s);
    }

    eq.forEach((el, i) => { const v = b ? b[2 + i * 8] / 255 : 0; el.style.height = Math.max(2, v * 12) + "px"; });
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

  audio.addEventListener("ended", () => { audio.currentTime = DROP; audio.play().catch(() => {}); });
  const setState = on => { snd.classList.toggle("off", !on); sndT.textContent = on ? "sound" : "muted"; };

  enter.addEventListener("click", () => {
    setup();
    audio.volume = .7;
    try { audio.currentTime = DROP; } catch(e){}
    audio.play().then(() => setState(true), () => setState(false));
    enter.classList.add("gone");
  });
  snd.addEventListener("click", () => {
    setup();
    if (audio.paused){ audio.play().then(() => setState(true), () => {}); }
    else { audio.pause(); setState(false); }
  });
})();

const clock = document.getElementById("clock");
const tick = () => { try { clock.textContent = new Date().toLocaleTimeString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit"}) + " msk"; } catch(e){} };
tick(); setInterval(tick, 20000);

(() => {
  const c = document.getElementById("grain"), g = c.getContext("2d");
  c.width = 220; c.height = 220; c.style.width = "100%"; c.style.height = "100%";
  const img = g.createImageData(220, 220);
  const draw = () => {
    for (let i = 0; i < img.data.length; i += 4){ const v = Math.random()*255|0; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255; }
    g.putImageData(img, 0, 0);
  };
  draw();
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(draw, 90);
})();

(() => {
  const cv = document.getElementById("name"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let P = [], W = 0, H = 0, dpr = 1, mx = -9999, my = -9999;

  function build(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const off = document.createElement("canvas"); off.width = W; off.height = H;
    const o = off.getContext("2d");
    let fs = H * 0.95;
    o.font = `${fs}px UnifrakturMaguntia, serif`;
    const w = o.measureText("psinna55").width;
    if (w > W * 0.98) { fs *= (W * 0.98) / w; o.font = `${fs}px UnifrakturMaguntia, serif`; }
    o.fillStyle = "#fff"; o.textBaseline = "middle";
    o.fillText("psinna55", 0, H * 0.54);
    const d = o.getImageData(0, 0, W, H).data;
    const step = W < 500 ? 2 : 3, base = W < 500 ? 1.5 : 1.1;
    P = [];
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step){
      if (d[(y * W + x) * 4 + 3] > 128) P.push({hx:x, hy:y, x, y, vx:0, vy:0, s: Math.random() < .15 ? base + .5 : base});
    }
  }

  function frame(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#f0f0f0";
    const R = 70, R2 = R * R;
    const bass = AUDIO.bass, hit = AUDIO.hit, kick = AUDIO.kick;
    const cx = W / 2, cy = H / 2, sc = 1 + Math.max(0, bass - .5) * .08 + hit * .25, jit = hit * hit * 120 + Math.max(0, bass - .6) * 1.2;
    for (const p of P){
      const dx = p.x - mx, dy = p.y - my, d2 = dx*dx + dy*dy;
      if (d2 < R2){ const f = (1 - d2 / R2) * 6, d = Math.sqrt(d2) || 1; p.vx += dx / d * f; p.vy += dy / d * f; }
      if (jit > .05){ p.vx += (Math.random() - .5) * jit; p.vy += (Math.random() - .5) * jit; }
      if (kick){ const kx = p.hx - cx, ky = p.hy - cy, kd = Math.hypot(kx, ky) || 1; p.vx += kx / kd * 5 * Math.random() + (Math.random() - .5) * 3; p.vy += ky / kd * 5 * Math.random() + (Math.random() - .5) * 3; }
      const tx = cx + (p.hx - cx) * sc, ty = cy + (p.hy - cy) * sc;
      p.vx += (tx - p.x) * .06; p.vy += (ty - p.y) * .06;
      p.vx *= .82; p.vy *= .82;
      p.x += p.vx; p.y += p.vy;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  const pos = e => { const r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; };
  const burst = e => {
    const r = cv.getBoundingClientRect(), bx = e.clientX - r.left, by = e.clientY - r.top;
    for (const p of P){
      const dx = p.x - bx, dy = p.y - by, d = Math.hypot(dx, dy) || 1, f = Math.max(0, 1 - d / 220) * 38;
      p.vx += dx / d * f + (Math.random() - .5) * 4; p.vy += dy / d * f + (Math.random() - .5) * 4;
    }
  };
  cv.addEventListener("pointermove", pos);
  cv.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") pos(e); else burst(e); });
  cv.addEventListener("pointerleave", () => { mx = my = -9999; });
  cv.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") mx = my = -9999; });
  cv.addEventListener("pointercancel", () => { mx = my = -9999; });
  const start = () => { build(); frame(); };
  (document.fonts?.load ? document.fonts.load("100px UnifrakturMaguntia") : Promise.resolve()).then(start, start);
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { build(); if (reduce) frame(); }, 150); });
})();
</script>
</body>
</html>
